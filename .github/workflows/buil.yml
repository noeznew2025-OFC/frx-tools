
name: Build FRX AIM ASSIST

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract ZIP
        run: |
          unzip -q FRX-TOOLS-AIM-ASSIST-RINGAN.zip -d project

          SETTINGS=$(find project -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle project tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRX-AIM-ASSIST-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
