
name: Build FRX TOOLS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extract ZIP
        run: |
          unzip -q FRX-TOOLS-MULTI-KEYMAP-ULANG.zip -d project

      - name: Build APK
        run: |
          cd project/GrafikMcByFaruq
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRX-TOOLS-APK
          path: project/GrafikMcByFaruq/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
