name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Extract ZIP
        run: |
          ARCHIVE=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "ZIP project tidak ditemukan"
            exit 1
          fi
          mkdir project
          unzip -q "$ARCHIVE" -d project
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          if [ "$PROJECT_DIR" = "." ]; then
            echo "Gradle project tidak ditemukan"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRX-TOOLS-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
