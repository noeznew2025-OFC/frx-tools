
name: Build FRX Cyberpunk Red

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract ZIP
        run: |
          unzip -q FRX-TOOLS-CYBERPUNK-RED.zip -d project

      - name: Find Project
        run: |
          SETTINGS=$(find project -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Check Android SDK
        run: |
          echo "SDK platforms:"
          ls "$ANDROID_HOME/platforms"
          echo "Build tools:"
          ls "$ANDROID_HOME/build-tools"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRX-CYBERPUNK-RED-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
